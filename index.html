<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exploring Ideas</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0f172a;
      color: #f8fafc;
      padding: 1.5rem;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      padding: 2.5rem 2rem;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .avatar-placeholder {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
      color: #ffffff;
    }
    .subtitle {
      color: #38bdf8;
      font-size: 0.95rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1.25rem;
    }
    p {
      color: #94a3b8;
      line-height: 1.6;
      font-size: 1rem;
      margin-bottom: 1.5rem;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }
    .tag {
      background: rgba(51, 65, 85, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: #6366f1;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #4f46e5;
    }
    .btn-secondary {
      background: rgba(51, 65, 85, 0.8);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .btn-secondary:hover {
      background: rgba(71, 85, 105, 0.9);
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar-placeholder">&amp;</div>
    <h1>Garuda</h1>
    <div class="subtitle">Exploring Ideas &amp; Building Systems</div>
    <p>A digital sandbox for experimenting with code, design, technology, and thoughts.</p>
    
    <!--div class="tags">
      <span class="tag">💡 Technology</span>
      <span class="tag">🧪 Experiments</span>
      <span class="tag">🚀 Projects</span>
      <span class="tag">📝 Writing</span>
  </div-->

    <div class="links">
      <a href="mailto:contact@garuda.dev" class="btn btn-secondary">✉️ contact@garuda.dev</a>
    </div>
  </div>
</body>
</html>
